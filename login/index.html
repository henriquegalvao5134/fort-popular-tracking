<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Entrar — Fort Popular</title>
  <style>
    :root {
      --red:    #dc2626;
      --red2:   #b91c1c;
      --gold:   #FFD700;
      --bg:     #0d0d0d;
      --card:   #161616;
      --card2:  #1e1e1e;
      --border: rgba(255,255,255,0.10);
      --text:   #f2f2f2;
      --muted:  #888;
      --green:  #4ade80;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-wrap {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    /* Logo */
    .logo {
      text-align: center;
    }
    .brand-box {
      background: #CC1B1B;
      padding: 10px 32px;
      border-radius: 10px;
      border: 3px solid var(--gold);
      display: inline-block;
      text-align: center;
      margin-bottom: 12px;
    }
    .brand-top {
      font-size: 9px;
      color: var(--gold);
      letter-spacing: 5px;
      font-weight: 800;
      font-family: Arial, sans-serif;
    }
    .brand-fort {
      font-family: Impact, 'Arial Black', Arial, sans-serif;
      font-size: 38px;
      color: #fff;
      letter-spacing: 2px;
      font-weight: 900;
      line-height: 1;
    }
    .brand-popular {
      font-family: Impact, 'Arial Black', Arial, sans-serif;
      font-size: 38px;
      color: var(--gold);
      letter-spacing: 2px;
      font-weight: 900;
      line-height: 1;
    }
    .logo-sub {
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Card */
    .login-card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
    }

    .login-card h2 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .login-card p {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      background: var(--card2);
      border: 1.5px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      padding: 11px 14px;
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    .field input:focus { border-color: var(--red); }
    .field input::placeholder { color: var(--muted); }

    .err {
      display: none;
      background: rgba(220,38,38,0.10);
      border: 1px solid rgba(220,38,38,0.30);
      border-radius: 8px;
      color: #f87171;
      font-size: 0.82rem;
      padding: 10px 14px;
      margin-bottom: 16px;
    }

    .btn-login {
      width: 100%;
      background: var(--red);
      border: none;
      border-radius: 9px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s;
      box-shadow: 0 2px 12px rgba(220,38,38,0.35);
      margin-top: 4px;
    }
    .btn-login:hover { background: var(--red2); }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-footer {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="logo">
    <div class="brand-box">
      <div class="brand-top">FARMÁCIAS</div>
      <div class="brand-fort">FORT</div>
      <div class="brand-popular">POPULAR</div>
    </div>
    <div class="logo-sub">Painel interno</div>
  </div>

  <div class="login-card">
    <h2>Entrar</h2>
    <p>Use o email e senha da sua conta para acessar o painel.</p>

    <div id="err" class="err"></div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="f-email" placeholder="seuemail@exemplo.com" autocomplete="email" autofocus>
    </div>

    <div class="field">
      <label>Senha</label>
      <input type="password" id="f-senha" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn-login" id="btn-login">Entrar</button>
  </div>

  <div class="login-footer">
    Farmácias Fort Popular · Itaipuaçu &nbsp;·&nbsp; Acesso restrito
  </div>
</div>

<script>
const btn   = document.getElementById('btn-login');
const fEmail= document.getElementById('f-email');
const fSenha= document.getElementById('f-senha');
const errEl = document.getElementById('err');

async function doLogin() {
  const email  = fEmail.value.trim();
  const senha  = fSenha.value;

  if (!email || !senha) {
    showErr('Preencha email e senha.');
    return;
  }

  btn.disabled     = true;
  btn.textContent  = 'Entrando…';
  errEl.style.display = 'none';

  try {
    const r = await fetch('/api/auth/login', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ email, password: senha }),
    });
    const d = await r.json();

    if (!r.ok) {
      showErr(d.error || 'Credenciais inválidas. Tente novamente.');
      return;
    }

    // Salva token e redireciona
    localStorage.setItem('fp_token', d.token);
    if (d.user?.email) localStorage.setItem('fp_user_email', d.user.email);

    // Redireciona para onde o usuário queria ir, ou para /acesso/
    const next = new URLSearchParams(location.search).get('next') || '/acesso/';
    window.location.href = next;

  } catch (e) {
    showErr('Erro de conexão. Tente novamente.');
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Entrar';
  }
}

function showErr(msg) {
  errEl.textContent    = msg;
  errEl.style.display  = 'block';
}

btn.addEventListener('click', doLogin);
fEmail.addEventListener('keydown', e => { if (e.key === 'Enter') fSenha.focus(); });
fSenha.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// Se já tem token válido, redireciona direto
if (localStorage.getItem('fp_token')) {
  window.location.href = '/acesso/';
}
</script>

</body>
</html>
