<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Conversões — Farmácia Fort Popular</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --red:    #dc2626;
      --red2:   #b91c1c;
      --bg:     #0f0c0c;
      --card:   #160f0f;
      --border: rgba(220,38,38,0.22);
      --text:   #f0e8e8;
      --muted:  #7a6060;
      --green:  #4ade80;
      --blue:   #60a5fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 16px 52px;
    }

    /* ── HEADER ── */
    header { text-align: center; margin-bottom: 24px; }
    header h1 {
      font-family: 'Playfair Display', Georgia, serif;
      color: var(--red);
      font-size: 1.6rem;
      letter-spacing: 0.04em;
      margin-bottom: 5px;
    }
    header p { color: var(--muted); font-size: 0.85rem; }

    /* ── NAV TABS ── */
    .nav-tabs {
      display: flex;
      max-width: 460px;
      margin: 0 auto 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }
    .nav-tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 9px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .nav-tab.active { background: var(--red); color: #fff; font-weight: 700; }

    /* ── CARD ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      max-width: 460px;
      margin: 0 auto;
    }

    /* ── TIPO ── */
    .tipo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tipo-btn {
      padding: 14px 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 10px;
      font-size: 0.93rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      font-family: inherit;
    }
    .tipo-btn .ico { font-size: 1.4rem; }
    .tipo-btn.active {
      border-color: var(--red);
      color: var(--red);
      background: rgba(220,38,38,0.08);
    }

    /* ── ORIGEM ── */
    .origem-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-bottom: 20px;
    }
    .origem-btn {
      padding: 10px 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      font-family: inherit;
    }
    .origem-btn.active {
      border-color: var(--red);
      color: var(--red);
      background: rgba(220,38,38,0.08);
    }

    /* ── CAMPOS ── */
    .field { margin-bottom: 16px; }
    label {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 7px;
    }
    input {
      width: 100%;
      padding: 13px 15px;
      background: rgba(220,38,38,0.04);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: 0.97rem;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    input:focus { border-color: var(--red); }
    input::placeholder { color: var(--muted); }

    .value-row { display: none; }
    .value-row.show { display: block; }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.97rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      letter-spacing: 0.03em;
      transition: opacity 0.2s, transform 0.1s;
      font-family: inherit;
    }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.45; cursor: not-allowed; }

    .feedback {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
    }
    .feedback.ok {
      background: rgba(74,222,128,0.1);
      border: 1px solid rgba(74,222,128,0.3);
      color: var(--green);
      display: block;
    }
    .feedback.err {
      background: rgba(220,38,38,0.1);
      border: 1px solid rgba(220,38,38,0.3);
      color: #ef4444;
      display: block;
    }

    /* ── HISTÓRICO ── */
    #hist-section { display: none; max-width: 460px; margin: 0 auto; }

    .hist-col-title {
      display: none;
      font-family: 'Playfair Display', Georgia, serif;
      color: var(--red);
      font-size: 1rem;
      letter-spacing: 0.04em;
      margin-bottom: 14px;
    }

    .hist-filters {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .hist-filters input {
      flex: 1;
      min-width: 110px;
      padding: 10px 12px;
      font-size: 0.85rem;
    }
    .hist-filters .search-input { min-width: 160px; }
    .btn-filter {
      padding: 10px 18px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    /* Stats */
    .hist-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    @media (min-width: 480px) {
      .hist-summary { grid-template-columns: repeat(4, 1fr); }
    }
    .hist-stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 12px;
      text-align: center;
    }
    .hs-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    .hs-val   { font-size: 1.15rem; font-weight: 700; color: var(--red); }

    /* Table */
    .hist-table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
    thead th {
      padding: 10px 12px;
      text-align: left;
      color: var(--muted);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(220,38,38,0.04); }
    tbody td { padding: 10px 12px; color: var(--text); white-space: nowrap; }

    .badge-purchase { background: rgba(74,222,128,0.12); color: var(--green); padding: 2px 8px; border-radius: 20px; font-size: 0.71rem; font-weight: 600; }
    .badge-contact  { background: rgba(96,165,250,0.12); color: var(--blue);  padding: 2px 8px; border-radius: 20px; font-size: 0.71rem; font-weight: 600; }
    .meta-ok  { color: var(--green); font-size: 0.85rem; }
    .meta-no  { color: var(--muted); font-size: 0.85rem; }
    .plat-ico { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:4px; font-size:11px; font-weight:900; vertical-align:middle; flex-shrink:0; }
    .plat-meta   { background:#1877F2; color:#fff; font-style:italic; }
    .plat-google { background:#fff; color:#4285F4; }
    .plat-organic  { font-size:14px; }
    .plat-referral { font-size:14px; }

    .btn-upgrade {
      padding: 3px 10px;
      background: rgba(220,38,38,0.12);
      border: 1px solid rgba(220,38,38,0.35);
      color: var(--red);
      border-radius: 20px;
      font-size: 0.71rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      font-family: inherit;
    }
    .btn-upgrade:hover { background: var(--red); color: #fff; }

    .hist-empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 0.88rem; }

    /* ── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      width: 92%; max-width: 360px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.6);
    }
    .modal h3 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.1rem;
      color: var(--red);
      margin-bottom: 5px;
    }
    .modal p { font-size: 0.82rem; color: var(--muted); margin-bottom: 20px; }
    .modal .field { margin-bottom: 0; }
    .modal-btns { display: flex; gap: 8px; margin-top: 18px; }
    .modal-btns button {
      flex: 1; padding: 13px; border-radius: 9px;
      font-weight: 700; font-size: 0.9rem; cursor: pointer;
      border: none; font-family: inherit;
    }
    .btn-cancel  { background: rgba(255,255,255,0.05); color: var(--muted); border: 1px solid var(--border) !important; }
    .btn-confirm { background: var(--red); color: #fff; }

    /* ── DESKTOP 2-COLUNAS ── */
    @media (min-width: 820px) {
      body { padding: 28px 40px 48px; }
      header { margin-bottom: 18px; }
      .nav-tabs { display: none; }
      #main-cols {
        display: grid;
        grid-template-columns: 460px 1fr;
        gap: 24px;
        max-width: 1200px;
        margin: 0 auto;
        align-items: start;
      }
      #form-section, #hist-section {
        display: block !important;
        max-width: none;
      }
      .card { max-width: none; }
      .hist-col-title { display: block; }
    }
  </style>
</head>
<body>

<header>
  <h1>Fort Popular</h1>
  <p>Farmácia · Conversões WhatsApp</p>
</header>

<div class="nav-tabs">
  <button class="nav-tab active" onclick="showSection('form', this)">Registrar</button>
  <button class="nav-tab" onclick="showSection('hist', this)">Histórico</button>
</div>

<div id="main-cols">

<!-- ── FORMULÁRIO ── -->
<div id="form-section">
  <div class="card">

    <!-- Tipo -->
    <div class="tipo-grid">
      <button class="tipo-btn active" onclick="setTipo('Contact', this)">
        <span class="ico">💬</span>Contato
      </button>
      <button class="tipo-btn" onclick="setTipo('Purchase', this)">
        <span class="ico">💰</span>Venda
      </button>
    </div>

    <!-- Origem -->
    <div class="origem-grid">
      <button class="origem-btn active" data-o="ad"       onclick="setOrigem('ad', this)"><span class="plat-ico plat-meta" style="margin-right:5px;">f</span>Meta Ads</button>
      <button class="origem-btn"        data-o="google"   onclick="setOrigem('google', this)"><span class="plat-ico plat-google" style="margin-right:5px;">G</span>Google Ads</button>
      <button class="origem-btn"        data-o="organic"  onclick="setOrigem('organic', this)">🚶 Orgânico</button>
      <button class="origem-btn"        data-o="referral" onclick="setOrigem('referral', this)">🤝 Indicação</button>
    </div>

    <!-- Campos -->
    <div class="field">
      <label>Telefone / WhatsApp *</label>
      <input id="phone" type="tel" placeholder="(21) 9 8765-4321" inputmode="tel">
    </div>
    <div class="field">
      <label>Nome do cliente</label>
      <input id="name" type="text" placeholder="Maria Silva">
    </div>
    <div class="field value-row" id="value-row">
      <label>Valor da venda (R$) *</label>
      <input id="value" type="text" placeholder="0,00" inputmode="decimal">
    </div>
    <div class="field">
      <label>Data (padrão: hoje)</label>
      <input id="date" type="date">
    </div>

    <button class="btn-submit" id="btn-submit" onclick="submitForm()">Registrar contato</button>
    <div class="feedback" id="feedback"></div>

  </div>
</div>

<!-- ── HISTÓRICO ── -->
<div id="hist-section">
  <span class="hist-col-title">Histórico de conversões</span>

  <div class="hist-filters">
    <input type="date" id="h-from" placeholder="De">
    <input type="date" id="h-to"   placeholder="Até">
    <input type="search" id="h-q" class="search-input" placeholder="Nome ou telefone…"
           onkeydown="if(event.key==='Enter')loadHist()">
    <button class="btn-filter" onclick="loadHist()">Filtrar</button>
  </div>

  <div class="hist-summary">
    <div class="hist-stat">
      <div class="hs-label">Registros</div>
      <div class="hs-val" id="hs-total">—</div>
    </div>
    <div class="hist-stat">
      <div class="hs-label">Vendas</div>
      <div class="hs-val" id="hs-purchases">—</div>
    </div>
    <div class="hist-stat">
      <div class="hs-label">Receita</div>
      <div class="hs-val" id="hs-revenue">—</div>
    </div>
    <div class="hist-stat">
      <div class="hs-label">Investido <span class="plat-ico plat-meta" style="width:12px;height:12px;font-size:8px;vertical-align:0;">f</span></div>
      <div class="hs-val" id="hs-spend">—</div>
    </div>
  </div>

  <div class="card" style="padding:0;overflow:hidden;">
    <div class="hist-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Cliente</th>
            <th>Tipo</th>
            <th>Valor</th>
            <th>LTV</th>
            <th><span class="plat-ico plat-meta" style="width:14px;height:14px;font-size:9px;">f</span></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="hist-body">
          <tr><td colspan="7" class="hist-empty">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

</div><!-- /main-cols -->

<!-- ── MODAL: Contact → Purchase ── -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3>Promover para Venda</h3>
    <p id="modal-sub">Informe o valor da compra.</p>
    <div class="field">
      <label>Valor da venda (R$) *</label>
      <input id="modal-value" type="text" placeholder="0,00" inputmode="decimal">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel"  onclick="closeModal()">Cancelar</button>
      <button class="btn-confirm" onclick="confirmUpdate()">Confirmar</button>
    </div>
  </div>
</div>

<script>
const KEY = new URLSearchParams(location.search).get('key') || '';
let tipoAtual   = 'Contact';
let origemAtual = 'ad';
let editingId   = null;

// ── Init ──────────────────────────────────────────────
(function init() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  document.getElementById('h-from').value = `${y}-${m}-01`;
  document.getElementById('h-to').value   = today();
  if (window.innerWidth >= 820) loadHist();
})();

function today() { return new Date().toISOString().slice(0, 10); }

// ── Navegação (mobile) ────────────────────────────────
function showSection(section, btn) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('form-section').style.display = section === 'form' ? 'block' : 'none';
  document.getElementById('hist-section').style.display = section === 'hist' ? 'block' : 'none';
  if (section === 'hist') {
    if (!document.getElementById('h-from').value) {
      const d = new Date();
      document.getElementById('h-from').value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
      document.getElementById('h-to').value   = today();
    }
    loadHist();
  }
}

// ── Tipo / Origem ─────────────────────────────────────
function setTipo(t, btn) {
  tipoAtual = t;
  document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('value-row').classList.toggle('show', t === 'Purchase');
  document.getElementById('btn-submit').textContent = t === 'Purchase' ? 'Registrar venda' : 'Registrar contato';
}

function setOrigem(o, btn) {
  origemAtual = o;
  document.querySelectorAll('.origem-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ── Novo registro ─────────────────────────────────────
async function submitForm() {
  const phone = document.getElementById('phone').value.trim();
  const name  = document.getElementById('name').value.trim();
  const value = document.getElementById('value').value.trim();
  const date  = document.getElementById('date').value;

  if (!phone) { showFeedback('Informe o telefone do cliente.', false); return; }
  if (tipoAtual === 'Purchase' && !value) { showFeedback('Informe o valor da venda.', false); return; }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = 'Enviando…';
  document.getElementById('feedback').className = 'feedback';

  const body = { event_name: tipoAtual, phone, origem: origemAtual };
  if (name)  body.name  = name;
  if (value) body.value = value;
  if (date)  body.date  = date;

  try {
    const resp = await fetch('/api/log-conversion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-dash-key': KEY },
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (resp.ok && data.saved) {
      const capiMsg = data.meta_skipped ? ' — sem CAPI' : data.ok ? ' · ✓ Meta' : ' · ⚠ Meta falhou';
      showFeedback(`✓ Registrado${capiMsg}`, true);
      document.getElementById('phone').value = '';
      document.getElementById('name').value  = '';
      document.getElementById('value').value = '';
      document.getElementById('date').value  = '';
      document.getElementById('phone').focus();
    } else {
      showFeedback('Erro: ' + (data.error || 'inesperado'), false);
    }
  } catch { showFeedback('Erro de conexão.', false); }
  finally {
    btn.disabled = false;
    btn.textContent = tipoAtual === 'Purchase' ? 'Registrar venda' : 'Registrar contato';
  }
}

function showFeedback(msg, ok) {
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.className = 'feedback ' + (ok ? 'ok' : 'err');
  if (ok) setTimeout(() => { el.className = 'feedback'; }, 5000);
}

// ── Histórico ─────────────────────────────────────────
async function loadHist() {
  const body = document.getElementById('hist-body');
  body.innerHTML = '<tr><td colspan="7" class="hist-empty">Carregando...</td></tr>';
  ['hs-total','hs-purchases','hs-revenue','hs-spend'].forEach(id => document.getElementById(id).textContent = '—');

  const from = document.getElementById('h-from').value;
  const to   = document.getElementById('h-to').value;
  const q    = (document.getElementById('h-q').value || '').trim();

  const params = new URLSearchParams({ key: KEY, limit: '200' });
  if (from) params.set('from', from);
  if (to)   params.set('to',   to);
  if (q)    params.set('q',    q);

  try {
    const resp = await fetch('/api/conversions-history?' + params);
    if (resp.status === 401) {
      body.innerHTML = '<tr><td colspan="7" class="hist-empty">Chave inválida.</td></tr>';
      return;
    }
    const data = await resp.json();
    const rows = data.conversions || [];

    const purchases = rows.filter(r => r.event_name === 'Purchase');
    const revCents  = purchases.reduce((s, r) => s + (r.value_cents || 0), 0);
    const spendCents = data.spend_cents || 0;
    document.getElementById('hs-total').textContent     = rows.length;
    document.getElementById('hs-purchases').textContent = purchases.length;
    document.getElementById('hs-revenue').textContent   =
      'R$\u00a0' + (revCents / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
    document.getElementById('hs-spend').textContent     = spendCents
      ? 'R$\u00a0' + (spendCents / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2 })
      : '—';

    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="7" class="hist-empty">Nenhum registro no período.</td></tr>';
      return;
    }

    const origemIco = {
      ad:       '<span class="plat-ico plat-meta" title="Meta Ads">f</span>',
      google:   '<span class="plat-ico plat-google" title="Google Ads">G</span>',
      organic:  '<span class="plat-ico plat-organic" title="Orgânico">🚶</span>',
      referral: '<span class="plat-ico plat-referral" title="Indicação">🤝</span>',
    };
    const metaIcon = '<span class="plat-ico plat-meta" style="width:14px;height:14px;font-size:9px;">f</span>';

    body.innerHTML = rows.map(r => {
      const ph    = r.phone_last4 ? `****${r.phone_last4}` : '';
      const nome  = esc(r.display_name || '—');
      // Cliente: nome na primeira linha, telefone + origem na segunda
      const cli = `<span style="font-weight:600;">${nome}</span>`
        + (ph ? `<br><span style="color:var(--muted);font-size:.78em;">${ph} ${origemIco[r.origem] || ''}</span>` : '');
      const ic    = r.event_name === 'Contact';
      const badge = ic
        ? '<span class="badge-contact">Contato</span>'
        : '<span class="badge-purchase">Venda</span>';
      const val   = r.value_cents
        ? 'R$\u00a0' + (r.value_cents / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2 })
        : '—';
      // LTV: total all-time do cliente (só mostra se > 0 e tem phone)
      const ltv = (r.client_ltv_cents && r.phone_normalized)
        ? '<span style="color:var(--green);font-weight:700;">R$\u00a0'
          + (r.client_ltv_cents / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2 })
          + '</span>'
          + (r.client_purchases > 1 ? `<br><span style="color:var(--muted);font-size:.75em;">${r.client_purchases}x compras</span>` : '')
        : '<span style="color:var(--muted);">—</span>';
      const meta  = r.meta_ok
        ? `${metaIcon} <span class="meta-ok">✓</span>`
        : `<span class="meta-no">—</span>`;
      const upBtn = ic
        ? `<button class="btn-upgrade" onclick="openModal(${r.id},'${esc(r.display_name)}')">+ Venda</button>`
        : '';
      return `<tr>
        <td>${r.event_date || '—'}</td>
        <td>${cli}</td>
        <td>${badge}</td>
        <td>${val}</td>
        <td>${ltv}</td>
        <td style="white-space:nowrap;">${meta}</td>
        <td>${upBtn}</td>
      </tr>`;
    }).join('');
  } catch (e) {
    body.innerHTML = `<tr><td colspan="7" class="hist-empty">Erro: ${esc(e.message)}</td></tr>`;
  }
}

function esc(s) {
  return (s || '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── Modal ─────────────────────────────────────────────
function openModal(id, name) {
  editingId = id;
  document.getElementById('modal-sub').textContent = name ? `Cliente: ${name}` : 'Informe o valor da compra.';
  document.getElementById('modal-value').value = '';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('modal-value').focus(), 80);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingId = null;
}

async function confirmUpdate() {
  const value = document.getElementById('modal-value').value.trim();
  if (!value) { alert('Informe o valor.'); return; }
  if (!editingId) return;
  try {
    const resp = await fetch('/api/update-conversion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-dash-key': KEY },
      body: JSON.stringify({ id: editingId, event_name: 'Purchase', value }),
    });
    const data = await resp.json();
    if (resp.ok && data.ok) { closeModal(); loadHist(); }
    else alert('Erro: ' + (data.error || 'inesperado'));
  } catch { alert('Erro de conexão.'); }
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
</script>
</body>
