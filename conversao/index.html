<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Conversões — Farmácia Fort Popular</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* ── Variáveis ── */
    :root {
      --red:    #dc2626;
      --red2:   #b91c1c;
      --bg:     #0f0c0c;
      --card:   #160f0f;
      --border: rgba(220,38,38,0.22);
      --text:   #f0e8e8;
      --muted:  #7a6060;
      --green:  #4ade80;
      --blue:   #60a5fa;
      --yellow: #fbbf24;
    }

    /* ── Reset / Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      height: 56px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand h1 {
      font-family: 'Playfair Display', Georgia, serif;
      color: var(--red);
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      line-height: 1.1;
    }

    .brand p { color: var(--muted); font-size: 0.7rem; }

    .header-right { display: flex; align-items: center; gap: 14px; }

    .btn-novo {
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 7px 13px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-novo:hover { background: var(--red2); }

    .header-nav { display: flex; gap: 6px; }
    .header-nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.8rem;
      padding: 6px 10px;
      border-radius: 6px;
      transition: color .15s, background .15s;
    }
    .header-nav a:hover { color: var(--text); background: rgba(255,255,255,0.05); }

    /* ── BARRA DE CHIPS ── */
    .chips-bar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 14px;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .chips-bar::-webkit-scrollbar { display: none; }

    .chip {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      color: var(--muted);
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: inherit;
      transition: all .15s;
      flex-shrink: 0;
    }
    .chip:hover { border-color: var(--red); color: var(--text); }
    .chip.active { background: var(--red); border-color: var(--red); color: #fff; }
    .chip-cnt {
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 0 6px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .chip.active .chip-cnt { background: rgba(0,0,0,0.25); }

    /* ── FILTER BAR ── */
    .filter-bar {
      background: var(--bg);
      border-bottom: 1px solid rgba(220,38,38,0.1);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .filter-bar input[type="date"],
    .filter-bar input[type="text"] {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      padding: 6px 10px;
      font-size: 0.8rem;
      font-family: inherit;
    }
    .filter-bar input[type="date"] { width: 138px; flex-shrink: 0; }
    .filter-bar input[type="text"] { flex: 1; min-width: 100px; }
    .filter-bar input::placeholder { color: var(--muted); }
    .filter-bar input:focus { outline: none; border-color: var(--red); }
    .filter-bar input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); }

    .btn-buscar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      padding: 6px 14px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: border-color .15s;
    }
    .btn-buscar:hover { border-color: var(--red); }

    /* ── CONTENT AREA ── */
    .content-area {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── TABLE WRAP ── */
    .table-wrap {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
    }
    .table-wrap::-webkit-scrollbar { width: 6px; height: 6px; }
    .table-wrap::-webkit-scrollbar-track { background: transparent; }
    .table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .conv-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 520px;
    }

    .conv-table thead th {
      position: sticky;
      top: 0;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      text-align: left;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      color: var(--muted);
      text-transform: uppercase;
      white-space: nowrap;
      z-index: 2;
    }

    .conv-table tbody tr {
      border-bottom: 1px solid rgba(220,38,38,0.08);
      cursor: pointer;
      transition: background .1s;
    }
    .conv-table tbody tr:hover { background: rgba(220,38,38,0.06); }
    .conv-table tbody tr.active { background: rgba(220,38,38,0.12); }

    .conv-table td {
      padding: 11px 14px;
      font-size: 0.83rem;
      vertical-align: middle;
    }

    .col-date { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
    .contact-name { font-weight: 600; margin-bottom: 2px; }
    .contact-phone { font-size: 0.72rem; color: var(--muted); }

    /* ── BADGES ── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      gap: 3px;
    }
    .badge-green  { background: rgba(74,222,128,0.12); color: var(--green); }
    .badge-red    { background: rgba(220,38,38,0.12);  color: #f87171; }
    .badge-yellow { background: rgba(251,191,36,0.12); color: var(--yellow); }
    .badge-blue   { background: rgba(96,165,250,0.12); color: var(--blue); }
    .badge-muted  { background: rgba(122,96,96,0.12);  color: var(--muted); }

    /* ── CONFIDENCE ── */
    .conf-wrap { display: flex; align-items: center; gap: 6px; }
    .conf-bar { width: 46px; height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
    .conf-fill { height: 100%; border-radius: 2px; }
    .conf-high  { background: var(--green); }
    .conf-mid   { background: var(--yellow); }
    .conf-low   { background: #f87171; }
    .conf-num   { font-size: 0.72rem; color: var(--muted); min-width: 26px; }

    /* ── ROW ACTION ── */
    .row-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      padding: 4px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
      white-space: nowrap;
    }
    .row-btn:hover, tr.active .row-btn { border-color: var(--red); color: var(--red); }

    /* ── EMPTY / LOADING ── */
    .state-msg {
      padding: 52px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .state-msg .ico { font-size: 2rem; display: block; margin-bottom: 10px; }

    /* ── SIDE PANEL ── */
    .side-panel {
      width: 0;
      border-left: none;
      background: var(--card);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      transition: width .2s ease;
    }
    .side-panel.open {
      width: 420px;
      border-left: 1px solid var(--border);
      overflow: hidden;
    }
    .side-panel-inner {
      width: 420px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ── PANEL HEADER ── */
    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-shrink: 0;
    }
    .panel-name  { font-weight: 700; font-size: 0.95rem; margin-bottom: 3px; }
    .panel-phone { font-size: 0.78rem; color: var(--muted); }
    .panel-date  { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    .panel-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1rem;
      cursor: pointer;
      padding: 3px 8px;
      border-radius: 6px;
      line-height: 1;
      transition: color .15s;
      flex-shrink: 0;
    }
    .panel-close:hover { color: var(--text); }

    /* ── PANEL TABS ── */
    .panel-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-tab {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      padding: 10px 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-family: inherit;
      transition: all .15s;
      margin-bottom: -1px;
    }
    .panel-tab:hover { color: var(--text); }
    .panel-tab.active { color: var(--red); border-bottom-color: var(--red); }

    /* ── PANEL BODY ── */
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .panel-body::-webkit-scrollbar { width: 4px; }
    .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── IA TAB ── */
    .verdict-card {
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid;
    }
    .vc-venda   { background: rgba(74,222,128,0.07); border-color: rgba(74,222,128,0.25); }
    .vc-contato { background: rgba(96,165,250,0.07); border-color: rgba(96,165,250,0.2); }
    .vc-aberto  { background: rgba(122,96,96,0.08);  border-color: var(--border); }

    .verdict-label { font-size: 0.92rem; font-weight: 700; margin-bottom: 4px; }
    .verdict-conf  { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }
    .verdict-excerpt {
      font-size: 0.78rem; color: var(--muted); font-style: italic;
      line-height: 1.45; border-left: 2px solid var(--border); padding-left: 8px;
    }

    .ia-details { margin-bottom: 14px; }
    .ia-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.8rem;
      gap: 8px;
    }
    .ia-row:last-child { border: none; }
    .ia-row .lbl { color: var(--muted); flex-shrink: 0; }
    .ia-row .val { font-weight: 600; text-align: right; word-break: break-word; }

    .human-label-done {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .hld-confirmed { background: rgba(74,222,128,0.1); color: var(--green); }
    .hld-rejected  { background: rgba(220,38,38,0.1);  color: #f87171; }

    .btn-undo {
      background: none; border: none; color: inherit; opacity: 0.6;
      cursor: pointer; font-size: 0.72rem; text-decoration: underline; font-family: inherit;
    }
    .btn-undo:hover { opacity: 1; }

    .panel-actions { display: flex; flex-direction: column; gap: 8px; }

    .action-btn {
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.83rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: opacity .15s;
      text-align: left;
    }
    .action-btn:hover { opacity: 0.85; }
    .action-confirm { background: rgba(74,222,128,0.15); color: var(--green);  border: 1px solid rgba(74,222,128,0.3); }
    .action-correct { background: rgba(96,165,250,0.12); color: var(--blue);   border: 1px solid rgba(96,165,250,0.25); }
    .action-reject  { background: rgba(220,38,38,0.10);  color: #f87171;       border: 1px solid rgba(220,38,38,0.25); }

    /* ── MENSAGENS ── */
    .msgs-date-sep {
      text-align: center;
      color: var(--muted);
      font-size: 0.68rem;
      margin: 12px 0 6px;
    }
    .msg-row { display: flex; margin-bottom: 8px; }
    .msg-row.sent { justify-content: flex-end; }
    .msg-row.recv { justify-content: flex-start; }

    .msg-bubble {
      max-width: 84%;
      padding: 8px 11px;
      border-radius: 12px;
      font-size: 0.8rem;
      line-height: 1.5;
    }
    .sent .msg-bubble { background: rgba(220,38,38,0.22); border-radius: 12px 12px 3px 12px; }
    .recv .msg-bubble { background: rgba(255,255,255,0.08); border-radius: 12px 12px 12px 3px; }

    .msg-type-icon { margin-right: 3px; }
    .msg-text em { color: var(--muted); font-style: normal; font-size: 0.75rem; }
    .msg-time { font-size: 0.65rem; color: var(--muted); text-align: right; margin-top: 3px; }

    .msg-loading { text-align: center; color: var(--muted); padding: 24px; font-size: 0.82rem; }

    /* ── MODAIS ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-box {
      background: #1c1010;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px;
      width: 100%;
      max-width: 400px;
      max-height: 92vh;
      overflow-y: auto;
    }
    .modal-wide { max-width: 480px; }

    .modal-box h3 {
      font-family: 'Playfair Display', Georgia, serif;
      color: var(--red);
      font-size: 1.05rem;
      margin-bottom: 6px;
    }
    .modal-sub { color: var(--muted); font-size: 0.8rem; margin-bottom: 16px; }

    .modal-box label {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      margin: 10px 0 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .modal-box input,
    .modal-box select,
    .modal-box textarea {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 11px;
      font-size: 0.85rem;
      font-family: inherit;
    }
    .modal-box input:focus,
    .modal-box select:focus { outline: none; border-color: var(--red); }
    .modal-box select option { background: #1c1010; }

    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }

    .btn-cancel {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      padding: 9px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      transition: border-color .15s;
    }
    .btn-cancel:hover { border-color: var(--muted); color: var(--text); }

    .btn-primary {
      flex: 2;
      background: var(--red);
      border: none;
      border-radius: 8px;
      color: #fff;
      padding: 9px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      transition: background .15s;
    }
    .btn-primary:hover { background: var(--red2); }

    .btn-danger {
      flex: 2;
      background: rgba(220,38,38,0.15);
      border: 1px solid rgba(220,38,38,0.35);
      border-radius: 8px;
      color: #f87171;
      padding: 9px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      transition: background .15s;
    }
    .btn-danger:hover { background: rgba(220,38,38,0.25); }

    /* Form do modal de nova conversão */
    .tipo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tipo-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      padding: 9px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.83rem;
      transition: all .15s;
    }
    .tipo-btn.active { background: var(--red); border-color: var(--red); color: #fff; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22,15,15,0.96);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 20px;
      font-size: 0.82rem;
      color: var(--text);
      z-index: 200;
      max-width: 300px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,0.55);
      pointer-events: none;
      transition: opacity .25s;
    }
    .toast.toast-ok   { border-color: rgba(74,222,128,0.4); color: var(--green); }
    .toast.toast-err  { border-color: rgba(220,38,38,0.5);  color: #f87171; }
    .toast.toast-info { border-color: rgba(96,165,250,0.3); color: var(--blue); }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-nav a {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 9px 6px;
      text-decoration: none;
      color: var(--muted);
      font-size: 0.68rem;
      gap: 3px;
      transition: color .15s;
    }
    .bottom-nav a:hover, .bottom-nav a.bn-active { color: var(--red); }
    .bn-icon { font-size: 1.1rem; }

    /* ── RESPONSIVE ── */
    @media (max-width: 820px) {
      .header-nav { display: none; }
      .bottom-nav { display: flex; }

      .table-wrap { padding-bottom: 60px; }

      /* Painel vira overlay full-screen */
      .side-panel.open {
        position: absolute;
        inset: 0;
        width: 100% !important;
        z-index: 20;
        border-left: none;
      }
      .side-panel-inner { width: 100%; }
    }

    @media (max-width: 600px) {
      .hide-sm { display: none; }
      .filter-bar input[type="date"] { width: 110px; }
    }

    @media (max-width: 400px) {
      .hide-xs { display: none; }
      .filter-bar input[type="date"] { display: none; }
    }

    /* ── UTILITY ── */
    .hidden { display: none !important; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

<!-- ── HEADER ─────────────────────────────────────────── -->
<header>
  <div class="brand">
    <h1>Fort Popular</h1>
    <p>Farmácia · Central de Conversões</p>
  </div>
  <div class="header-right">
    <button class="btn-novo" id="btn-novo">+ Registrar</button>
    <nav class="header-nav" id="header-nav"></nav>
  </div>
</header>

<!-- ── CHIPS: filtros de status ───────────────────────── -->
<div class="chips-bar">
  <button class="chip active" data-filter="todas">Todas <span class="chip-cnt" id="cnt-todas">0</span></button>
  <button class="chip" data-filter="aguardando">⏳ Aguardando <span class="chip-cnt" id="cnt-aguardando">0</span></button>
  <button class="chip" data-filter="confirmadas">✓ Confirmadas <span class="chip-cnt" id="cnt-confirmadas">0</span></button>
  <button class="chip" data-filter="rejeitadas">✕ Rejeitadas <span class="chip-cnt" id="cnt-rejeitadas">0</span></button>
</div>

<!-- ── FILTER BAR ─────────────────────────────────────── -->
<div class="filter-bar">
  <input type="date" id="f-from" title="Data inicial">
  <input type="date" id="f-to"   title="Data final">
  <input type="text" id="f-q"    placeholder="Buscar telefone ou conversa…">
  <button class="btn-buscar" id="btn-buscar">Buscar</button>
</div>

<!-- ── CONTENT AREA ───────────────────────────────────── -->
<div class="content-area" id="content-area">

  <!-- TABELA -->
  <div class="table-wrap" id="table-wrap">
    <div class="state-msg" id="state-loading"><span class="ico">⏳</span>Carregando conversas…</div>
    <div class="state-msg hidden" id="state-empty"><span class="ico">💬</span>Nenhuma conversa encontrada</div>
    <table class="conv-table hidden" id="conv-table">
      <thead>
        <tr>
          <th>DATA</th>
          <th>CONTATO</th>
          <th class="hide-sm">STATUS IA</th>

<script>
// ═══════════════════════════════════════════════════════════
// ESTADO GLOBAL
// ═══════════════════════════════════════════════════════════
const KEY = new URLSearchParams(location.search).get('key') || '';

let allData      = [];
let filtered     = [];
let activeFilter = 'todas';
let activeRawId  = null;   // UUID sem prefixo 'ai_' da conversa aberta no painel
let msgCache     = {};     // cache de mensagens por rawId

// ═══════════════════════════════════════════════════════════
// INICIALIZAÇÃO
// ═══════════════════════════════════════════════════════════
function init() {
  buildNav();
  setDefaultDates();
  bindEvents();
  loadConversations();
}

function buildNav() {
  const links = [
    { href: `/acesso/?key=${KEY}`,    label: '⌂ Início' },
    { href: `/relatorio/?key=${KEY}`, label: '📊 Relatório' },
    { href: `/clientes/?key=${KEY}`,  label: '👥 Clientes' },
  ];
  document.getElementById('header-nav').innerHTML =
    links.map(l => `<a href="${l.href}">${l.label}</a>`).join('');
  document.getElementById('bottom-nav').innerHTML =
    links.map((l, i) =>
      `<a href="${l.href}" class="${i === 0 ? '' : ''}">
        <span class="bn-icon">${l.label.split(' ')[0]}</span>
        ${l.label.replace(/^\S+\s/, '')}
      </a>`
    ).join('');
}

function setDefaultDates() {
  const today  = new Date().toISOString().slice(0, 10);
  const ago30  = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10);
  document.getElementById('f-from').value = ago30;
  document.getElementById('f-to').value   = today;
}

// ═══════════════════════════════════════════════════════════
// CARREGAR DADOS
// ═══════════════════════════════════════════════════════════
async function loadConversations() {
  setLoadingState(true);

  const from = document.getElementById('f-from').value;
  const to   = document.getElementById('f-to').value;
  const q    = document.getElementById('f-q').value.trim();

  let url = `/api/agent-conversations?key=${encodeURIComponent(KEY)}&limit=300`;
  if (from) url += `&from=${from}`;
  if (to)   url += `&to=${to}`;
  if (q)    url += `&q=${encodeURIComponent(q)}`;

  try {
    const resp = await fetch(url);
    if (resp.status === 401) { showToast('Chave de acesso inválida.', 'err'); setLoadingState(false); return; }
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    allData = data.conversions || [];
    applyFilter();
  } catch (e) {
    showToast('Erro ao carregar: ' + e.message, 'err');
    setLoadingState(false);
  }
}

function setLoadingState(loading) {
  document.getElementById('state-loading').classList.toggle('hidden', !loading);
  document.getElementById('conv-table').classList.add('hidden');
  document.getElementById('state-empty').classList.add('hidden');
}

// ═══════════════════════════════════════════════════════════
// FILTROS
// ═══════════════════════════════════════════════════════════
function applyFilter() {
  switch (activeFilter) {
    case 'aguardando':
      filtered = allData.filter(c => c.observacao === 'venda' && !c.human_label);
      break;
    case 'confirmadas':
      filtered = allData.filter(c => c.human_label === 'venda');
      break;
    case 'rejeitadas':
      filtered = allData.filter(c => c.human_label === 'nao_venda');
      break;
    default:
      filtered = allData.slice();
  }

  // Contadores dos chips
  document.getElementById('cnt-todas').textContent       = allData.length;
  document.getElementById('cnt-aguardando').textContent  = allData.filter(c => c.observacao === 'venda' && !c.human_label).length;
  document.getElementById('cnt-confirmadas').textContent = allData.filter(c => c.human_label === 'venda').length;
  document.getElementById('cnt-rejeitadas').textContent  = allData.filter(c => c.human_label === 'nao_venda').length;

  renderTable();
}

// ═══════════════════════════════════════════════════════════
// RENDERIZAR TABELA
// ═══════════════════════════════════════════════════════════
function renderTable() {
  document.getElementById('state-loading').classList.add('hidden');

  if (!filtered.length) {
    document.getElementById('conv-table').classList.add('hidden');
    document.getElementById('state-empty').classList.remove('hidden');
    return;
  }

  document.getElementById('state-empty').classList.add('hidden');
  document.getElementById('conv-table').classList.remove('hidden');

  document.getElementById('conv-body').innerHTML = filtered.map(item => {
    const rawId  = item.id.replace(/^ai_/, '');
    const active = rawId === activeRawId ? 'active' : '';
    const phone  = item.phone_last4 ? `****${item.phone_last4}` : '—';
    const name   = item.display_name && item.display_name !== item.phone_last4
                 ? escHtml(item.display_name)
                 : '—';
    const produto = escHtml(item.produto || '—');

    return `
      <tr class="conv-row ${active}" data-raw-id="${rawId}" onclick="openPanel('${rawId}')">
        <td class="col-date">${fmtDate(item.event_date)}</td>
        <td>
          <div class="contact-name">${name}</div>
          <div class="contact-phone">${phone}</div>
        </td>
        <td class="hide-sm">${statusBadge(item)}</td>
        <td class="hide-sm">${confBar(item)}</td>
        <td class="hide-xs">${produto}</td>
        <td><button class="row-btn" onclick="event.stopPropagation(); openPanel('${rawId}')">Ver →</button></td>
      </tr>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════════
// PAINEL LATERAL
// ═══════════════════════════════════════════════════════════
async function openPanel(rawId) {
  activeRawId = rawId;

  const item = allData.find(c => c.id.replace(/^ai_/, '') === rawId);
  if (!item) return;

  // Cabeçalho do painel
  const name  = item.display_name && item.display_name !== item.phone_last4
              ? item.display_name : 'Sem nome';
  const phone = item.phone_last4 ? `WhatsApp ****${item.phone_last4}` : 'Sem telefone';

  document.getElementById('panel-name').textContent  = name;
  document.getElementById('panel-phone').textContent = phone;
  document.getElementById('panel-date').textContent  = item.event_date ? `Data: ${fmtDate(item.event_date)}` : '';

  // Abre painel
  document.getElementById('side-panel').classList.add('open');

  // Ativa aba IA
  switchPanelTab('ia');

  // Renderiza conteúdo da aba IA
  renderIATab(item, rawId);

  // Destaca linha ativa
  document.querySelectorAll('.conv-row').forEach(r => r.classList.remove('active'));
  const row = document.querySelector(`.conv-row[data-raw-id="${rawId}"]`);
  if (row) row.classList.add('active');

  // Pré-carrega mensagens em background
  if (!msgCache[rawId]) loadMsgs(rawId);
}

function closePanel() {
  document.getElementById('side-panel').classList.remove('open');
  activeRawId = null;
  document.querySelectorAll('.conv-row').forEach(r => r.classList.remove('active'));
}

function switchPanelTab(tab) {
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('tab-ia').classList.toggle('hidden',       tab !== 'ia');
  document.getElementById('tab-conversa').classList.toggle('hidden', tab !== 'conversa');
}

// ═══════════════════════════════════════════════════════════
// ABA IA
// ═══════════════════════════════════════════════════════════
function renderIATab(item, rawId) {
  const verdict = item.observacao || 'em_aberto';
  const conf    = Math.round((item.ai_confidence || 0) * 100);
  const valor   = item.value_cents
                ? 'R$ ' + (item.value_cents / 100).toFixed(2).replace('.', ',')
                : 'Não informado';
  const produto = item.produto || 'Não informado';
  const excerpt = item.excerpt || '';

  let verdictLabel, vcClass;
  if (verdict === 'venda') {
    verdictLabel = '💊 Venda detectada pela IA';
    vcClass = 'vc-venda';
  } else if (verdict === 'contato') {
    verdictLabel = '📞 Contato (sem venda detectada)';
    vcClass = 'vc-contato';
  } else {
    verdictLabel = '❓ Conversa em aberto';
    vcClass = 'vc-aberto';
  }

  document.getElementById('ia-verdict-card').innerHTML = `
    <div class="verdict-card ${vcClass}">
      <div class="verdict-label">${verdictLabel}</div>
      <div class="verdict-conf">Confiança da IA: <strong>${conf}%</strong></div>
      ${excerpt ? `<div class="verdict-excerpt">"${escHtml(excerpt)}"</div>` : ''}
    </div>
    <div class="ia-details">
      <div class="ia-row"><span class="lbl">Valor IA</span><span class="val">${valor}</span></div>
      <div class="ia-row"><span class="lbl">Produto</span><span class="val">${escHtml(produto)}</span></div>
    </div>
  `;

  // Botões de ação
  const isPending   = !item.human_label && verdict === 'venda';
  const isConfirmed = item.human_label === 'venda';
  const isRejected  = item.human_label === 'nao_venda';

  let actionsHtml = '';
  if (isPending) {
    actionsHtml = `
      <button class="action-btn action-confirm" onclick="confirmar('${rawId}')">✓ Confirmar Venda</button>
      <button class="action-btn action-correct"  onclick="abrirCorrigir('${rawId}')">✏️ Corrigir valor / produto</button>
      <button class="action-btn action-reject"   onclick="abrirRejeitar('${rawId}')">✕ Rejeitar</button>
    `;
  } else if (isConfirmed) {
    actionsHtml = `
      <div class="human-label-done hld-confirmed">
        <span>✓ Venda confirmada pela equipe</span>
        <button class="btn-undo" onclick="desfazer('${rawId}')">Desfazer</button>
      </div>
    `;
  } else if (isRejected) {
    actionsHtml = `
      <div class="human-label-done hld-rejected">
        <span>✕ Rejeitada pela equipe</span>
        <button class="btn-undo" onclick="desfazer('${rawId}')">Desfazer</button>
      </div>
    `;
  }

  document.getElementById('panel-actions').innerHTML = actionsHtml;
}

// ═══════════════════════════════════════════════════════════
// ABA CONVERSA (mensagens)
// ═══════════════════════════════════════════════════════════
async function loadMsgs(rawId) {
  const wrap = document.getElementById('msgs-wrap');
  wrap.innerHTML = '<div class="msg-loading">Carregando mensagens…</div>';

  try {
    const resp = await fetch(`/api/ia/conversa?id=${rawId}&key=${encodeURIComponent(KEY)}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    const msgs = data.mensagens || [];
    msgCache[rawId] = msgs;

    if (!msgs.length) {
      wrap.innerHTML = '<div class="msg-loading">Nenhuma mensagem encontrada.</div>';
      return;
    }

    let lastDate = '';
    wrap.innerHTML = msgs.map(m => {
      const isMe  = !!m.from_me;
      const tipo  = m.tipo || 'texto';
      const txt   = m.texto_extraido || '';
      const icons = { audio: '🎙️', imagem: '🖼️', documento: '📄' };
      const icon  = icons[tipo] || '';
      const time  = m.created_at
                  ? new Date(m.created_at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
                  : '';
      const dateStr = m.created_at ? m.created_at.slice(0, 10) : '';
      let sep = '';
      if (dateStr && dateStr !== lastDate) {
        sep = `<div class="msgs-date-sep">${fmtDate(dateStr)}</div>`;
        lastDate = dateStr;
      }
      return `${sep}
        <div class="msg-row ${isMe ? 'sent' : 'recv'}">
          <div class="msg-bubble">
            ${icon ? `<span class="msg-type-icon">${icon}</span>` : ''}
            <div class="msg-text">${txt ? escHtml(txt) : '<em>Mídia sem transcrição</em>'}</div>
            <div class="msg-time">${time}</div>
          </div>
        </div>`;
    }).join('');
  } catch (e) {
    wrap.innerHTML = '<div class="msg-loading">Erro ao carregar mensagens.</div>';
  }
}

// ═══════════════════════════════════════════════════════════
// AÇÕES DE REVISÃO
// ═══════════════════════════════════════════════════════════
async function confirmar(rawId) {
  const item = allData.find(c => c.id.replace(/^ai_/, '') === rawId);
  await reviewAction(rawId, 'confirmar', {
    phone:   item?.phone_normalized,
    value:   item?.value_cents ? item.value_cents / 100 : 0,
    produto: item?.produto,
    name:    item?.display_name,
  });
}

function abrirCorrigir(rawId) {
  const item = allData.find(c => c.id.replace(/^ai_/, '') === rawId);
  document.getElementById('corrigir-sub').textContent = item?.display_name || `****${item?.phone_last4}` || rawId;
  document.getElementById('c-value').value   = item?.value_cents ? (item.value_cents / 100).toFixed(2) : '';
  document.getElementById('c-produto').value = item?.produto || '';
  document.getElementById('c-name').value    = item?.display_name || '';
  document.getElementById('c-origem').value  = 'ad';
  document.getElementById('overlay-corrigir').dataset.rawId = rawId;
  document.getElementById('overlay-corrigir').classList.remove('hidden');
}

function abrirRejeitar(rawId) {
  const item = allData.find(c => c.id.replace(/^ai_/, '') === rawId);
  document.getElementById('rejeitar-sub').textContent = item?.display_name || `****${item?.phone_last4}` || rawId;
  document.getElementById('overlay-rejeitar').dataset.rawId = rawId;
  document.getElementById('overlay-rejeitar').classList.remove('hidden');
}

async function desfazer(rawId) {
  await reviewAction(rawId, 'desfazer', {});
}

async function reviewAction(rawId, action, params) {
  const body = { id: rawId, action, ...params };

  // Optimistic update: atualiza o estado local imediatamente
  const idx = allData.findIndex(c => c.id.replace(/^ai_/, '') === rawId);
  const prev = idx !== -1 ? allData[idx].human_label : undefined;

  if (idx !== -1) {
    if (action === 'rejeitar')  allData[idx].human_label = 'nao_venda';
    else if (action === 'desfazer') allData[idx].human_label = null;
    else allData[idx].human_label = 'venda';
  }

  applyFilter();
  if (activeRawId === rawId) {
    const item = allData.find(c => c.id.replace(/^ai_/, '') === rawId);
    if (item) renderIATab(item, rawId);
  }

  try {
    const resp = await fetch('/api/ia/revisar', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json', 'x-dash-key': KEY },
      body:    JSON.stringify(body),
    });
    const data = await resp.json();

    if (!resp.ok || !data.ok) {
      // Rollback
      if (idx !== -1) allData[idx].human_label = prev;
      applyFilter();
      if (activeRawId === rawId) {
        const item = allData.find(c => c.id.replace(/^ai_/, '') === rawId);
        if (item) renderIATab(item, rawId);
      }
      throw new Error(data.error || 'Erro inesperado');
    }

    const msgs = {
      confirmar: '✓ Venda confirmada!',
      corrigir:  '✓ Venda corrigida!',
      rejeitar:  '✕ Rejeitado.',
      desfazer:  'Ação desfeita.',
    };
    showToast(msgs[action] || 'Salvo!', action === 'rejeitar' ? 'err' : action === 'desfazer' ? 'info' : 'ok');
  } catch (e) {
    showToast('Erro: ' + e.message, 'err');
  }
}

// ═══════════════════════════════════════════════════════════
// MODAL: REGISTRAR MANUAL
// ═══════════════════════════════════════════════════════════
let tipoAtual = 'Contact';

function bindFormTipo() {
  document.querySelectorAll('.tipo-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      tipoAtual = btn.dataset.tipo;
      document.getElementById('n-value-field').classList.toggle('hidden', tipoAtual !== 'Purchase');
    });
  });
}

async function submitNovo() {
  const phone = document.getElementById('n-phone').value.trim();
  if (!phone) { showToast('Informe o WhatsApp.', 'err'); return; }

  const body = {
    event_name: tipoAtual,
    phone,
    name:    document.getElementById('n-name').value.trim()    || undefined,
    value:   tipoAtual === 'Purchase' ? document.getElementById('n-value').value : undefined,
    produto: document.getElementById('n-produto').value.trim() || undefined,
    origem:  document.getElementById('n-origem').value,
    observacao: document.getElementById('n-obs').value.trim()  || undefined,
  };

  const btn = document.getElementById('confirm-novo');
  btn.disabled = true;

  try {
    const resp = await fetch('/api/log-conversion', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json', 'x-dash-key': KEY },
      body:    JSON.stringify(body),
    });
    const data = await resp.json();
    if (!resp.ok || !data.ok) throw new Error(data.error || 'Erro');
    document.getElementById('overlay-novo').classList.add('hidden');
    showToast('✓ Conversão registrada!', 'ok');
    // Limpar form
    ['n-phone','n-name','n-value','n-produto','n-obs'].forEach(id => {
      document.getElementById(id).value = '';
    });
  } catch (e) {
    showToast('Erro: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

// ═══════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════
let _toastTimer;
function showToast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast toast-${type}`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.className = 'toast hidden', 3500);
}

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
function statusBadge(item) {
  if (item.human_label === 'venda')     return '<span class="badge badge-green">✓ Confirmada</span>';
  if (item.human_label === 'nao_venda') return '<span class="badge badge-red">✕ Rejeitada</span>';
  if (item.observacao === 'venda')      return '<span class="badge badge-yellow">⏳ Aguardando</span>';
  if (item.observacao === 'contato')    return '<span class="badge badge-blue">📞 Contato</span>';
  return '<span class="badge badge-muted">Em aberto</span>';
}

function confBar(item) {
  if (!item.ai_confidence && !item.human_label) return '<span style="color:var(--muted)">—</span>';
  const pct = Math.round((item.ai_confidence || 0) * 100);
  const cls = pct >= 80 ? 'conf-high' : pct >= 60 ? 'conf-mid' : 'conf-low';
  return `<div class="conf-wrap">
    <div class="conf-bar"><div class="conf-fill ${cls}" style="width:${pct}%"></div></div>
    <span class="conf-num">${pct}%</span>
  </div>`;
}

function fmtDate(str) {
  if (!str) return '—';
  // str: 'YYYY-MM-DD' or ISO
  const d = new Date(str.length === 10 ? str + 'T12:00:00' : str);
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' });
}

function escHtml(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ═══════════════════════════════════════════════════════════
// EVENT LISTENERS
// ═══════════════════════════════════════════════════════════
function bindEvents() {
  // Chips de filtro
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeFilter = chip.dataset.filter;
      applyFilter();
    });
  });

  // Buscar
  document.getElementById('btn-buscar').addEventListener('click', loadConversations);
  document.getElementById('f-q').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadConversations();
  });

  // Fechar painel
  document.getElementById('panel-close').addEventListener('click', closePanel);

  // Tabs do painel
  document.querySelectorAll('.panel-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      switchPanelTab(tab);
      if (tab === 'conversa' && activeRawId) {
        if (!msgCache[activeRawId]) {
          loadMsgs(activeRawId);
        } else {
          // usa cache
          const wrap = document.getElementById('msgs-wrap');
          if (!wrap.innerHTML || wrap.innerHTML.includes('msg-loading')) {
            loadMsgs(activeRawId);
          }
        }
      }
    });
  });

  // Modal: Corrigir
  document.getElementById('confirm-corrigir').addEventListener('click', async () => {
    const rawId  = document.getElementById('overlay-corrigir').dataset.rawId;
    const value  = parseFloat(document.getElementById('c-value').value) || 0;
    const item   = allData.find(c => c.id.replace(/^ai_/, '') === rawId);
    document.getElementById('overlay-corrigir').classList.add('hidden');
    await reviewAction(rawId, 'corrigir', {
      value,
      produto: document.getElementById('c-produto').value.trim(),
      name:    document.getElementById('c-name').value.trim() || item?.display_name,
      phone:   item?.phone_normalized,
      origem:  document.getElementById('c-origem').value,
    });
  });
  document.getElementById('cancel-corrigir').addEventListener('click', () =>
    document.getElementById('overlay-corrigir').classList.add('hidden'));

  // Modal: Rejeitar
  document.getElementById('confirm-rejeitar').addEventListener('click', async () => {
    const rawId  = document.getElementById('overlay-rejeitar').dataset.rawId;
    const motivo = document.getElementById('r-motivo').value;
    document.getElementById('overlay-rejeitar').classList.add('hidden');
    await reviewAction(rawId, 'rejeitar', { motivo });
  });
  document.getElementById('cancel-rejeitar').addEventListener('click', () =>
    document.getElementById('overlay-rejeitar').classList.add('hidden'));

  // Modal: Nova conversão
  document.getElementById('btn-novo').addEventListener('click', () =>
    document.getElementById('overlay-novo').classList.remove('hidden'));
  document.getElementById('cancel-novo').addEventListener('click', () =>
    document.getElementById('overlay-novo').classList.add('hidden'));
  document.getElementById('confirm-novo').addEventListener('click', submitNovo);
  bindFormTipo();

  // Fechar modais ao clicar fora
  ['overlay-corrigir', 'overlay-rejeitar', 'overlay-novo'].forEach(id => {
    document.getElementById(id).addEventListener('click', function(e) {
      if (e.target === this) this.classList.add('hidden');
    });
  });

  // Fechar painel no mobile com ESC
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!document.getElementById('overlay-corrigir').classList.contains('hidden') ||
          !document.getElementById('overlay-rejeitar').classList.contains('hidden') ||
          !document.getElementById('overlay-novo').classList.contains('hidden')) return;
      closePanel();
    }
  });
}

// ═══════════════════════════════════════════════════════════
// START
// ═══════════════════════════════════════════════════════════
init();
</script>
