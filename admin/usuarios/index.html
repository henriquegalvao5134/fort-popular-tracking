<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Usuários — Fort Popular</title>
  <style>
    :root {
      --red:     #dc2626;
      --gold:    #FFD700;
      --bg:      #0d0d0d;
      --card:    #161616;
      --card2:   #1e1e1e;
      --sidebar: #101010;
      --border:  rgba(255,255,255,0.10);
      --border2: rgba(255,255,255,0.06);
      --text:    #f2f2f2;
      --muted:   #888;
      --green:   #4ade80;
      --blue:    #60a5fa;
      --yellow:  #fbbf24;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      height: 52px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-dot { width: 8px; height: 8px; background: var(--red); border-radius: 50%; box-shadow: 0 0 8px rgba(220,38,38,0.7); }
    .brand-text h1 { font-size: 1rem; font-weight: 700; }
    .brand-text h1 em { color: var(--gold); font-style: normal; }
    .brand-text p { font-size: 0.66rem; color: var(--muted); }

    /* APP LAYOUT */
    .app-layout { flex: 1; display: flex; overflow: hidden; }

    /* SIDEBAR */
    .sidebar {
      width: 180px; flex-shrink: 0; background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 12px 0; overflow-y: auto;
    }
    .sidebar::-webkit-scrollbar { display: none; }
    .sidebar-label {
      padding: 6px 16px 4px; font-size: 0.58rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; color: rgba(136,136,136,0.45); margin-top: 8px;
    }
    .sidebar-label:first-child { margin-top: 0; }
    .nav-item {
      display: flex; align-items: center; gap: 9px; padding: 9px 12px; margin: 1px 8px;
      border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 0.82rem;
      font-weight: 500; transition: .15s; white-space: nowrap; border: 1px solid transparent;
    }
    .nav-item:hover { background: rgba(255,255,255,0.06); color: var(--text); }
    .nav-item.active { background: rgba(220,38,38,0.15); border-color: rgba(220,38,38,0.3); color: #ff6b6b; font-weight: 600; }
    .nav-item-icon { font-size: 1rem; flex-shrink: 0; line-height: 1; }

    /* MAIN */
    .main-content { flex: 1; overflow-y: auto; padding: 24px; }

    .page-title {
      font-size: 1.25rem; font-weight: 700; margin-bottom: 4px;
    }
    .page-sub { font-size: 0.82rem; color: var(--muted); margin-bottom: 24px; }

    /* CARD */
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    }
    .card-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-title { font-size: 0.9rem; font-weight: 600; }

    /* FORM */
    .new-user-form {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px; margin-bottom: 20px;
    }
    .form-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 16px; }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .field { flex: 1; min-width: 180px; }
    .field label { display: block; font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    .field input {
      width: 100%; background: var(--card2); border: 1.5px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 10px 13px; font-size: 0.88rem;
      font-family: inherit; outline: none; transition: border-color .15s;
    }
    .field input:focus { border-color: var(--red); }
    .field input::placeholder { color: var(--muted); }

    .form-actions { margin-top: 16px; display: flex; gap: 10px; align-items: center; }
    .btn-create {
      background: var(--red); border: none; border-radius: 8px; color: #fff;
      padding: 10px 20px; font-size: 0.88rem; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: background .15s;
    }
    .btn-create:hover { background: #b91c1c; }
    .btn-create:disabled { opacity: 0.5; cursor: not-allowed; }

    .form-msg { font-size: 0.8rem; }
    .msg-ok  { color: var(--green); }
    .msg-err { color: #f87171; }

    /* TABLE */
    .user-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    .user-table thead th {
      padding: 12px 16px; text-align: left; font-size: 0.63rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .user-table tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); }
    .user-table tbody tr:last-child { border-bottom: none; }
    .user-table tbody tr:hover { background: rgba(255,255,255,0.02); }
    .user-table tbody td { padding: 12px 16px; vertical-align: middle; }
    .user-email { font-weight: 600; }
    .user-date  { font-size: 0.75rem; color: var(--muted); }

    .btn-del {
      background: rgba(220,38,38,0.10); border: 1px solid rgba(220,38,38,0.25);
      border-radius: 7px; color: #f87171; padding: 6px 12px; font-size: 0.78rem;
      cursor: pointer; font-family: inherit; transition: all .15s;
    }
    .btn-del:hover { background: rgba(220,38,38,0.22); }

    .state-msg { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 0.88rem; }

    /* BOTTOM NAV */
    .bottom-nav {
      display: none; position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card); border-top: 1px solid var(--border); z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-nav a {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 9px 6px; text-decoration: none;
      color: var(--muted); font-size: 0.68rem; gap: 3px; transition: color .15s;
    }
    .bottom-nav a.bn-active, .bottom-nav a:hover { color: var(--red); }
    .bn-icon { font-size: 1.1rem; }

    @media (max-width: 680px) {
      .sidebar { display: none; }
      .bottom-nav { display: flex; }
      .main-content { padding: 14px 14px 72px; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-dot"></div>
    <div class="brand-text">
      <h1>Fort <em>Popular</em></h1>
      <p>Gerenciamento de Usuários</p>
    </div>
  </div>
</header>

<div class="app-layout">
  <nav class="sidebar" id="sidebar-nav"></nav>

  <div class="main-content">
    <div class="page-title">⚙️ Usuários</div>
    <div class="page-sub">Crie e gerencie contas de acesso ao painel interno.</div>

    <!-- Novo usuário -->
    <div class="new-user-form">
      <div class="form-title">Adicionar Novo Usuário</div>
      <div class="form-row">
        <div class="field">
          <label>Email</label>
          <input type="email" id="f-email" placeholder="usuario@email.com" autocomplete="off">
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="f-senha" placeholder="mínimo 6 caracteres" autocomplete="new-password">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-create" id="btn-create">+ Criar Usuário</button>
        <span class="form-msg" id="form-msg"></span>
      </div>
    </div>

    <!-- Lista de usuários -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Usuários cadastrados</span>
        <button class="btn-del" style="border:none;background:transparent;color:var(--muted);cursor:pointer"
                id="btn-refresh">↻ Atualizar</button>
      </div>
      <div id="user-list">
        <div class="state-msg">Carregando…</div>
      </div>
    </div>

  </div>
</div>

<nav class="bottom-nav" id="bottom-nav"></nav>

<script>
// ─── AUTH ──────────────────────────────────────────────────
const TOKEN    = localStorage.getItem('fp_token') || '';
const KEY_BACK = new URLSearchParams(location.search).get('key') || localStorage.getItem('fp_key') || '';

if (!TOKEN && !KEY_BACK) {
  window.location.href = '/login/?next=' + encodeURIComponent(location.pathname);
}

function authHeaders() {
  if (TOKEN) return { 'Authorization': 'Bearer ' + TOKEN };
  return {};
}
function authQuery() {
  if (TOKEN) return '';
  return '?key=' + encodeURIComponent(KEY_BACK);
}
function doLogout() {
  localStorage.removeItem('fp_token');
  localStorage.removeItem('fp_key');
  localStorage.removeItem('fp_user_email');
  window.location.href = '/login/';
}

// ─── SIDEBAR ───────────────────────────────────────────────
function buildNav() {
  const links = [
    { href: '/acesso',         icon: '⌂',  label: 'Início' },
    { href: '/relatorio',      icon: '📊', label: 'Relatório' },
    { href: '/clientes',       icon: '👥', label: 'Clientes' },
    { href: '/conversao',      icon: '💊', label: 'Conversões' },
    { href: '/admin/usuarios', icon: '⚙️', label: 'Usuários' },
  ];
  const cur = location.pathname.replace(/\/$/, '');
  document.getElementById('sidebar-nav').innerHTML =
    `<span class="sidebar-label">Menu</span>` +
    links.map(l => {
      const active = cur.startsWith(l.href) ? 'active' : '';
      return `<a class="nav-item ${active}" href="${l.href}/">
        <span class="nav-item-icon">${l.icon}</span>${l.label}
      </a>`;
    }).join('') +
    `<div style="flex:1"></div>
     <div style="border-top:1px solid var(--border);padding:8px 0;">
       <a class="nav-item" href="#" onclick="doLogout();return false;" style="color:#e05a5a;">
         <span class="nav-item-icon">⏻</span>Sair
       </a>
     </div>`;

  document.getElementById('bottom-nav').innerHTML =
    links.slice(0,4).map(l => {
      const active = cur.startsWith(l.href) ? 'bn-active' : '';
      return `<a class="${active}" href="${l.href}/"><span class="bn-icon">${l.icon}</span>${l.label}</a>`;
    }).join('');
}

// ─── LISTAR ────────────────────────────────────────────────
async function loadUsers() {
  const listEl = document.getElementById('user-list');
  listEl.innerHTML = '<div class="state-msg">Carregando…</div>';

  const sep = authQuery() ? authQuery() + '&' : '?';
  try {
    const r = await fetch('/api/admin/usuarios' + sep.slice(0,-1), {
      headers: authHeaders(),
    });
    if (r.status === 401) {
      listEl.innerHTML = '<div class="state-msg" style="color:#f87171">Acesso negado. Apenas administradores podem gerenciar usuários.</div>';
      return;
    }
    const d = await r.json();
    if (!d.ok) {
      listEl.innerHTML = `<div class="state-msg" style="color:#f87171">${d.error}</div>`;
      return;
    }
    renderUsers(d.users || []);
  } catch (e) {
    listEl.innerHTML = `<div class="state-msg" style="color:#f87171">Erro: ${e.message}</div>`;
  }
}

function renderUsers(users) {
  if (!users.length) {
    document.getElementById('user-list').innerHTML =
      '<div class="state-msg">Nenhum usuário cadastrado ainda.</div>';
    return;
  }

  document.getElementById('user-list').innerHTML = `
    <table class="user-table">
      <thead>
        <tr>
          <th>Email</th>
          <th>Criado em</th>
          <th>Último acesso</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${users.map(u => `
          <tr>
            <td><div class="user-email">${esc(u.email)}</div></td>
            <td><div class="user-date">${fmtDate(u.created_at)}</div></td>
            <td><div class="user-date">${u.last_sign_in_at ? fmtDate(u.last_sign_in_at) : '—'}</div></td>
            <td>
              <button class="btn-del" onclick="deleteUser('${u.id}','${esc(u.email)}')">
                Remover
              </button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

// ─── CRIAR ─────────────────────────────────────────────────
document.getElementById('btn-create').addEventListener('click', async () => {
  const email  = document.getElementById('f-email').value.trim();
  const senha  = document.getElementById('f-senha').value;
  const msgEl  = document.getElementById('form-msg');
  const btn    = document.getElementById('btn-create');

  msgEl.textContent = '';
  if (!email || !senha) { showFormMsg('Preencha email e senha.', false); return; }
  if (senha.length < 6) { showFormMsg('Senha mínima: 6 caracteres.', false); return; }

  btn.disabled = true;
  try {
    const r = await fetch('/api/admin/usuarios', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body:    JSON.stringify({ email, password: senha }),
    });
    const d = await r.json();
    if (!r.ok || !d.ok) {
      showFormMsg(d.error || 'Erro ao criar.', false); return;
    }
    showFormMsg(`✓ Usuário ${email} criado!`, true);
    document.getElementById('f-email').value = '';
    document.getElementById('f-senha').value = '';
    loadUsers();
  } catch (e) {
    showFormMsg('Erro de conexão.', false);
  } finally {
    btn.disabled = false;
  }
});

// ─── DELETAR ───────────────────────────────────────────────
async function deleteUser(id, email) {
  if (!confirm(`Remover ${email}? Esta ação não pode ser desfeita.`)) return;

  const r = await fetch(`/api/admin/usuarios?id=${id}`, {
    method:  'DELETE',
    headers: authHeaders(),
  });
  const d = await r.json().catch(() => ({}));
  if (r.ok && d.ok) {
    loadUsers();
  } else {
    alert('Erro ao remover: ' + (d.error || r.status));
  }
}

// ─── HELPERS ───────────────────────────────────────────────
function showFormMsg(msg, ok) {
  const el = document.getElementById('form-msg');
  el.textContent = msg;
  el.className = 'form-msg ' + (ok ? 'msg-ok' : 'msg-err');
}

function fmtDate(str) {
  if (!str) return '—';
  return new Date(str).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' })
       + ' ' + new Date(str).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── INÍCIO ────────────────────────────────────────────────
buildNav();
loadUsers();
document.getElementById('btn-refresh').addEventListener('click', loadUsers);
</script>
</body>
</html>
